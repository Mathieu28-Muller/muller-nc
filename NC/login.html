<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module NC — Nouvelle adresse</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:40px 36px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;background:#1e3a1e;border:1px solid #2d6a2d;color:#7dcea0;font-size:0.78rem;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:28px}
h1{color:#fff;font-size:1.25rem;font-weight:700;margin-bottom:10px}
p{color:#888;font-size:0.92rem;line-height:1.6;margin-bottom:28px}
.url-box{background:#0d1f0d;border:2px solid #2d6a2d;border-radius:10px;padding:18px 22px;margin-bottom:28px}
.url-box span{display:block;color:#aaa;font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.url-box a{color:#7dcea0;font-size:1.05rem;font-weight:700;text-decoration:none;word-break:break-all}
.url-box a:hover{text-decoration:underline}
.btn{display:inline-block;background:#c0392b;color:#fff;font-size:0.95rem;font-weight:700;padding:13px 32px;border-radius:8px;text-decoration:none;transition:background .18s}
.btn:hover{background:#a93226}
.footer{color:#444;font-size:0.75rem;margin-top:32px}
</style>
</head>
<body>
<div class="card">
  <div class="badge">✓ Site en production</div>
  <h1>Le module NC a déménagé</h1>
  <p>L'application Non-Conformités est désormais hébergée sur le serveur de production Muller Automotive.</p>
  <div class="url-box">
    <span>Nouvelle adresse</span>
    <a href="https://quali-form.mullerautomotive.fr/NC/" target="_blank">
      quali-form.mullerautomotive.fr/NC/
    </a>
  </div>
  <a class="btn" href="https://quali-form.mullerautomotive.fr/NC/" target="_blank">
    Accéder au module NC →
  </a>
  <div class="footer">Muller Automotive — Service Qualité</div>
</div>
</body>
</html>
