server {
    client_max_body_size 200m;
    server_name quali-form.mullerautomotive.fr;

    location / {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/quali-form.mullerautomotive.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/quali-form.mullerautomotive.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = quali-form.mullerautomotive.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name quali-form.mullerautomotive.fr;
    return 404; # managed by Certbot
}
